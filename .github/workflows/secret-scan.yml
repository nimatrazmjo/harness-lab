name: Secret Scan

# devops.ci_secret_scan: promotes scripts/check-no-committed-secrets.sh's idea (gitleaks) into
# an actual required GitHub Actions check on every PR, instead of something an agent has to
# remember to run manually. Uses the official gitleaks/gitleaks-action, which runs `gitleaks
# detect` against the PR's commits using gitleaks' own default ruleset (includes an AWS access
# key ID rule matching AKIA[0-9A-Z]{16}). Free for public repos (this repo is public) — no
# GITLEAKS_LICENSE needed.
#
# Triggers on pull_request only (not workflow_dispatch) — see devops/manual.md's documented
# workflow_dispatch platform quirk (a workflow's dispatch-eligibility can get permanently stuck
# if its GitHub-assigned workflow ID was first registered while the file only existed on a
# non-default branch). pull_request is also simply the right trigger for a required PR check.

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
