# nginx reverse proxy for the AI Clinical Scribe API + web app.
# Deploy target: EC2 instance. nginx terminates TLS on 443; the Node process
# (apps/api) listens on localhost only and is never exposed on 80/443 directly.
#
# TLS cert: obtain a CA-issued cert (e.g. certbot / Let's Encrypt) — do NOT use
# a self-signed cert. See scripts/verify-tls.sh for the acceptance check.

upstream scribe_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    # Let's Encrypt HTTP-01 challenge path stays on 80; everything else redirects to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/scribe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scribe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # The frontend calls /api/*; the Node app's own routes are unprefixed
    # (/auth, /encounters, ...) — strip /api here the same way the web app's
    # local Vite dev proxy does (apps/web/vite.config.ts).

    # SSE endpoint (note generation) must not be buffered — buffering turns
    # progressive streaming into spinner-then-dump. Matches
    # POST /encounters/:id/scribe/generate.
    location ~ ^/api/(encounters/[^/]+/scribe/.*)$ {
        proxy_pass http://scribe_api/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://scribe_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/scribe-web;
        try_files $uri /index.html;
    }
}
