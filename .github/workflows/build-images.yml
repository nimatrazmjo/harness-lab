name: Build Images

# devops.ci_build_images: validates that both production Dockerfiles (apps/api/Dockerfile,
# apps/web/Dockerfile — already `passing`, not modified here) actually compile, on every PR.
# Pure build validation, nothing is pushed to a registry from a PR build — push-on-main is a
# separate, later feature (devops.cd_push_ecr_main). Uses Buildx with the GitHub Actions cache
# backend (cache-from/cache-to: type=gha) so PR builds reuse layers instead of building cold
# every time.
#
# devops.ci_image_scan_trivy: each job also loads its just-built image (`load: true`) into the
# local Docker daemon and runs a real Trivy CRITICAL/HIGH scan against it in the same job — same
# job, not a separate one, so Trivy scans the actual artifact this PR built rather than
# rebuilding it a second time. Fails the job (`--exit-code 1`) on any unallowlisted finding;
# `.trivyignore` (repo root) is the reviewed allowlist for genuine false positives / inapplicable
# base-image findings, each entry commented with why — see that file's header for the real
# CVEs found and fixed vs. the handful left allowlisted with justification.
#
# Both Dockerfiles build from the REPO ROOT (per their own header comments — they reach into
# libs/shared-types and libs/ai via the pnpm workspace), so `context: .` here, not the app
# subdirectory.

on:
  pull_request:

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  build-api:
    name: build-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scribe-api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: scribe-api:ci
          cache-from: type=gha,scope=scribe-api
          cache-to: type=gha,mode=max,scope=scribe-api

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: Scan scribe-api image for CRITICAL/HIGH CVEs
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignorefile .trivyignore scribe-api:ci

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scribe-web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: scribe-web:ci
          cache-from: type=gha,scope=scribe-web
          cache-to: type=gha,mode=max,scope=scribe-web

      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"

      - name: Scan scribe-web image for CRITICAL/HIGH CVEs
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignorefile .trivyignore scribe-web:ci
